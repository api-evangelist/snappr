aid: snappr
name: Snappr
description: >-
  Snappr is an on-demand visual content marketplace that connects businesses
  with a global network of professional photographers and videographers, plus
  automated and human-augmented photo editing services. The Snappr API (the "API
  for visual content", available to Snappr for Enterprise customers) lets
  developers programmatically check coverage and availability, book photoshoots,
  submit photo editing jobs against presets, and retrieve the resulting images
  and videos. Authentication is a bearer API key; a sandbox environment mirrors
  production for testing, and custom webhooks notify on booking changes. Backed
  by Foundry Group and surfaced into the API Evangelist network for enrichment.
