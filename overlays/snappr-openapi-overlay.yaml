overlay: 1.0.0
info:
  title: API Evangelist enhancements for Snappr API
  version: 1.0.0
extends: openapi/snappr-openapi.yml
actions:
  - target: $.info
    update:
      x-apievangelist-rating: 4
      x-apievangelist-source: https://docs.snappr.com/
      x-api-category: [photography, visual-content, marketplace, editing]
  - target: $.info
    update:
      x-audience: enterprise
      x-access: Available only to Snappr for Enterprise customers.
  - target: $.components.securitySchemes.bearerAuth
    update:
      x-key-management: https://app.snappr.com/enterprise/api
